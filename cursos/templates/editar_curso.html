<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Curso</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 8px; margin-top: 5px;
            border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; }
        .btn-salvar { background-color: #28a745; color: white; }
        .btn-salvar:hover { background-color: #218838; }
        .btn-voltar { background-color: #6c757d; color: white; text-decoration: none; display: inline-block; }
        .btn-voltar:hover { background-color: #5a6268; }
        .alerta-sucesso {
            background-color: #d4edda; color: #155724;
            border: 1px solid #c3e6cb; border-radius: 4px;
            padding: 12px; margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Editar Curso</h1>

    {% if status == '1' %}
        <div class="alerta-sucesso">✅ Curso atualizado com sucesso!</div>
    {% endif %}

    <form method="POST" action="{% url 'editar_curso' curso.id %}">
        {% csrf_token %}

        <label for="nome">Nome do Curso:</label>
        <input type="text" id="nome" name="nome" value="{{ curso.nome }}" maxlength="40" required>

        <label for="carga_horaria">Carga Horária (horas):</label>
        <input type="number" id="carga_horaria" name="carga_horaria" value="{{ curso.carga_horaria }}" required>

        <label for="ativo">Status:</label>
        <select id="ativo" name="ativo">
            <option value="true" {% if curso.ativo %}selected{% endif %}>Ativo</option>
            <option value="false" {% if not curso.ativo %}selected{% endif %}>Inativo</option>
        </select>

        <br>
        <button type="submit" class="btn btn-salvar">💾 Salvar Alterações</button>
        <a href="{% url 'listar_cursos' %}" class="btn btn-voltar">← Voltar para Lista</a>
    </form>
</body>
</html>
