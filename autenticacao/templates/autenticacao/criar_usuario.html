{% extends 'base.html' %}

{% block titulo %}Criar Usuário{% endblock %}

{% block conteudo %}
<style>
    .form-box {
        max-width: 400px;
        margin: 60px auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        border: 1px solid #dee2e6;
    }
    .form-box h1 { margin-bottom: 20px; font-size: 22px; color: #333; }
    .form-box p label { font-weight: bold; }
    .form-box p input[type="text"],
    .form-box p input[type="password"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-top: 4px;
        box-sizing: border-box;
    }
    .btn-criar {
        width: 100%;
        padding: 10px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 15px;
        cursor: pointer;
        margin-top: 10px;
    }
    .btn-criar:hover { background: #218838; }
    .alerta-sucesso { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 4px; padding: 10px; margin-bottom: 14px; }
    .link-voltar { display: block; text-align: center; margin-top: 16px; font-size: 14px; }
    .errorlist { color: red; font-size: 13px; list-style: none; padding: 0; margin: 2px 0 0 0; }
</style>

<div class="form-box">
    <h1>👤 Criar Usuário</h1>
    <hr style="margin-bottom:20px;">

    {% if sucesso %}
        <div class="alerta-sucesso">{{ sucesso }}</div>
    {% endif %}

    <form method="POST" action="{% url 'criar_usuario' %}">
        {% csrf_token %}

        {{ form.as_p }}

        <input type="submit" value="Criar" class="btn-criar">
    </form>

    <a href="{% url 'login' %}" class="link-voltar">← Voltar ao login</a>
</div>
{% endblock %}
