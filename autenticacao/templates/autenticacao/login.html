{% extends 'base.html' %}

{% block titulo %}Login{% endblock %}

{% block conteudo %}
<style>
    .login-box {
        max-width: 400px;
        margin: 60px auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        border: 1px solid #dee2e6;
    }
    .login-box h1 { margin-bottom: 20px; font-size: 22px; color: #333; }
    .login-box p label { font-weight: bold; }
    .login-box p input[type="text"],
    .login-box p input[type="password"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-top: 4px;
        box-sizing: border-box;
    }
    .btn-entrar {
        width: 100%;
        padding: 10px;
        background: #343a40;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 15px;
        cursor: pointer;
        margin-top: 10px;
    }
    .btn-entrar:hover { background: #23272b; }
    .erro { color: red; font-size: 13px; margin-top: 6px; }
    .link-criar { display: block; text-align: center; margin-top: 16px; font-size: 14px; }
</style>

<div class="login-box">
    <h1>🔐 Login</h1>
    <hr style="margin-bottom:20px;">

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        {{ form.as_p }}

        {% if form.non_field_errors %}
            <p class="erro">{{ form.non_field_errors }}</p>
        {% endif %}

        <input type="submit" value="Entrar" class="btn-entrar">
    </form>

    <a href="{% url 'criar_usuario' %}" class="link-criar">Criar novo usuário</a>
</div>
{% endblock %}
